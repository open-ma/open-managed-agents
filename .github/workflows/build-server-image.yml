name: Build OpenMA Server Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'openma-server-v*'
    paths:
      - '.github/workflows/build-server-image.yml'
      - '.node-version'
      - '.pnpm-approve-builds.json'
      - 'apps/agent/**'
      - 'apps/console/**'
      - 'apps/integrations/**'
      - 'apps/main/**'
      - 'apps/main-fly/**'
      - 'apps/main-node/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/build-server-image.yml'
      - '.node-version'
      - '.pnpm-approve-builds.json'
      - 'apps/agent/**'
      - 'apps/console/**'
      - 'apps/integrations/**'
      - 'apps/main/**'
      - 'apps/main-fly/**'
      - 'apps/main-node/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify server release surface
        run: |
          pnpm --filter @open-managed-agents/main-node typecheck
          pnpm --filter @open-managed-agents/main-node test
          pnpm --filter @open-managed-agents/main-fly typecheck
          pnpm --filter @open-managed-agents/main-fly test
          pnpm --filter managed-agents-console build

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}
            type=match,pattern=openma-server-v(.*),group=1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish server image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/main-node/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=openma-server
          cache-to: type=gha,mode=max,scope=openma-server
          provenance: mode=max
          sbom: true

      - name: Record immutable image digest
        if: github.event_name != 'pull_request'
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
